version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mcp_vision_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    environment:
      MONGO_INITDB_DATABASE: mcp_vision_db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_vision_backend
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./.env:/app/.env:ro
    depends_on:
      - mongodb
    restart: always
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=mcp_vision_db
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:
